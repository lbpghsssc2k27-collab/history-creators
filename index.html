<style>
:root{--navy:#0c1a33;--navy2:#13264a;--navy3:#1b3262;--gold:#c9a24b;--gold2:#e6c97e;--ink:#eef1f7;--mute:#9aa7c2;--line:rgba(201,162,75,.28)}

.ph{aspect-ratio:4/3;border:1px solid var(--line);position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:12px;font-size:.88rem;background:linear-gradient(135deg,var(--navy3),var(--navy2));cursor:pointer}
.ph:hover{border-color:var(--gold2)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}

.pb{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-left:20px solid var(--gold2);border-top:12px solid transparent;border-bottom:12px solid transparent;filter:drop-shadow(0 0 5px #000)}

#lb{position:fixed;inset:0;background:#000;display:none;place-items:center;z-index:20}
#lb.o{display:grid}#lb img{max-width:100vw;max-height:100vh;object-fit:contain;pointer-events:none}
#lb iframe{width:min(96vw,1100px);aspect-ratio:16/9;border:0}
#lb button{position:absolute;background:#0009;color:var(--gold2);border:1px solid var(--line);font-size:24px;padding:4px 14px;cursor:pointer}
#lb .x{top:10px;right:10px}#lb .l{left:8px;top:50%}#lb .r{right:8px;top:50%}
dialog{background:var(--navy2);color:var(--ink);border:1px solid var(--gold);padding:26px;width:min(360px,92vw);margin:auto}
dialog::backdrop{background:#050a16bf}
dialog h3{font-size:1.7rem;margin-bottom:10px}
input{width:100%;padding:10px;margin:6px 0;background:var(--navy);border:1px solid var(--line);color:var(--ink);font:inherit}
@media(max-width:720px){.hero .wrap{grid-template-columns:1fr}.seal{display:none}nav .wrap{flex-wrap:wrap;padding:8px 22px}}
</style></head><body>
<nav id="nav"></nav><div id="app"></div>
<footer>LAL BIHARI PILOT GOVERNMENT HIGH SCHOOL SSC 2K27 · History Creators</footer>
<div id="lb"></div>
<dialog id="dlg"><h3>Owner log in</h3><input id="em" type="email" placeholder="Email" autocomplete="email"><input id="pw" type="password" placeholder="Password" autocomplete="current-password"><div class="bar" style="margin:12px 0 0"><button class="btn solid" onclick="doLogin()">Log in</button><button class="btn" onclick="dlg.close()">Close</button></div></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL='https://ipiuezemcumnviodicua.supabase.co',SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlwaXVlemVtY3VtbnZpb2RpY3VhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzNDY3NTksImV4cCI6MjEwNjkyMjc1OX0.-ViwkMyQpBsqDri9zgO7QO0jHEXUP8-jIdQKbDS5VvM',B='photos';
let sb=null,demo=true;
try{if(!SB_URL.startsWith('PASTE')&&window.supabase){sb=supabase.createClient(SB_URL,SB_KEY);demo=false}}catch(e){}
let user=null,albums=[],media=[],list=[],li=0,busy='';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pub=p=>sb.storage.from(B).getPublicUrl(p).data.publicUrl;
const th=m=>m.kind=='video'?`https://i.ytimg.com/vi/${m.youtube_id}/hqdefault.jpg`:(m.thumb_path&&sb?pub(m.thumb_path):'');
const mb=n=>n>=1e6?(n/1e6).toFixed(1)+' MB':Math.ceil(n/1e3)+' KB';
const route=()=>{const h=location.hash;return h.startsWith('#/a/')?{k:'a',id:h.slice(4)}:h=='#/videos'?{k:'v'}:{k:'h',s:h=='#/albums'}};
async function load(){
  if(demo){albums=['Class group photos','Farewell day','Trips and events'].map((t,i)=>({id:'d'+i,title:t,position:i}));
    media=[['Group photo','photo','d0'],['Farewell speech','video','d1'],['Sports day','photo','d2'],['Annual function','video','d2'],['Last bench','photo','d0']].map(([t,k,a],i)=>({id:'m'+i,t,kind:k,album_id:a,position:i,size:0}));return render()}
  const [a,m]=await Promise.all([sb.from('albums').select('*').order('position').order('created_at'),sb.from('media').select('*').order('position').order('created_at')]);
  if(a.error||m.error)alert('Could not load: '+(a.error||m.error).message);
  albums=a.data||[];media=m.data||[];render();
}
const tile=(m,i,own,cv)=>`<div class="ph" onclick="view(${i})">${th(m)?`<img src="${th(m)}" loading="lazy" draggable="false">`:esc(m.t||'')}${m.kind=='video'?'<i class="pb"></i>':''}<em>${m.kind=='video'?'Video':'Photo'}</em>${own?`<div class="ctl" onclick="event.stopPropagation()"><button onclick="move('${m.id}',-1)">‹</button><button onclick="move('${m.id}',1)">›</button>${cv?`<button onclick="cover('${m.id}')">${cv==m.id?'★':'☆'}</button>`:''}<button onclick="delMedia('${m.id}')">✕</button><button style="pointer-events:none">${m.kind=='video'?'YT':mb(m.size)}</button></div>`:''}</div>`;
function render(){
  const r=route(),used=media.reduce((s,m)=>s+(m.size||0),0);
  $('#nav').innerHTML=`<div class="wrap"><a class="brand" href="#/">History Creators</a><ul><li><a href="#/albums">Albums</a></li><li><a href="#/videos">Videos</a></li></ul><div>${user?`<small>${mb(used)} / 1 GB</small> <button class="btn" onclick="out()">Log out</button>`:`<button class="btn" onclick="ask()">Owner log in</button>`}</div></div>`;
  const vids=media.filter(m=>m.kind=='video'),own=!!user;
  if(r.k=='h'){list=vids.slice(0,4);
    $('#app').innerHTML=`<header class="hero"><div class="wrap"><div><div class="year">2K27</div><h1>LAL BIHARI PILOT GOVERNMENT HIGH SCHOOL SSC 2K27</h1><p>Our class photos, farewell videos and favourite moments, kept in one place for the whole batch.</p><a class="btn solid" href="#/albums">View albums</a> <a class="btn" href="#/videos">Video gallery</a></div>
    <svg class="seal" viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="92" fill="none" stroke="#c9a24b" stroke-width="2"/><circle cx="100" cy="100" r="80" fill="none" stroke="#c9a24b" stroke-dasharray="2 5"/><path d="M100 48l14 30 33 4-24 23 6 33-29-16-29 16 6-33-24-23 33-4z" fill="none" stroke="#e6c97e" stroke-width="2.5" stroke-linejoin="round"/><text x="100" y="152" text-anchor="middle" font-family="Cormorant Garamond,serif" font-size="20" font-weight="700" fill="#e6c97e">SSC 2K27</text></svg></div></header>
    <section id="albums"><div class="wrap"><div class="head"><h2>Albums</h2><p>Sorted by event</p>${own?'<button class="btn solid" onclick="newAlbum()">New album</button>':''}</div><div class="grid">${albums.map(a=>{const ms=media.filter(m=>m.album_id==a.id),c=ms.find(m=>m.id==a.cover_id)||ms[0];return `<a class="album" href="#/a/${a.id}"><div class="ph">${c&&th(c)?`<img src="${th(c)}" loading="lazy" draggable="false">`:''}</div><h3>${esc(a.title)}</h3><small>${ms.length} items</small></a>`}).join('')||'<small>No albums yet.</small>'}</div></div></section>
    <section style="padding-top:0"><div class="wrap"><div class="head"><h2>Video gallery</h2><a class="btn" href="#/videos">Open video gallery</a></div><div class="grid">${list.map((m,i)=>tile(m,i)).join('')||'<small>No videos yet.</small>'}</div></div></section>`;
    if(r.s)$('#albums').scrollIntoView();return}
  if(r.k=='v'){list=vids;
    $('#app').innerHTML=`<section><div class="wrap"><div class="head"><h2>Video gallery</h2><a class="btn" href="#/">Back home</a></div>${own?`<div class="bar"><button class="btn solid" onclick="addVid(null)">Add YouTube video</button></div>`:''}<div class="grid">${list.map((m,i)=>tile(m,i,own)).join('')||'<small>No videos yet.</small>'}</div></div></section>`;return}
  const al=albums.find(a=>a.id==r.id);if(!al){$('#app').innerHTML='<section><div class="wrap"><small>Loading…</small></div></section>';return}
  list=media.filter(m=>m.album_id==al.id);
  $('#app').innerHTML=`<section><div class="wrap"><div class="head"><h2>${esc(al.title)}</h2><a class="btn" href="#/albums">All albums</a></div>${own?`<div class="bar"><label class="btn solid">Upload photos<input type="file" accept="image/*" multiple hidden onchange="up(this)"></label><button class="btn" onclick="addVid('${al.id}')">Add YouTube video</button><button class="btn" onclick="ren()">Rename</button><button class="btn" onclick="delAlbum()">Delete album</button><small>${busy}</small></div>`:''}<div class="grid">${list.map((m,i)=>tile(m,i,own,al.cover_id||'-')).join('')||'<small>This album is empty.</small>'}</div></div></section>`;
}
// viewer
function view(i){li=i;show();$('#lb').classList.add('o')}
function show(){const m=list[li];$('#lb').innerHTML=(m.kind=='video'?`<iframe src="https://www.youtube-nocookie.com/embed/${m.youtube_id}?rel=0" allow="fullscreen" allowfullscreen></iframe>`:(sb&&m.path?`<img src="${pub(m.path)}" draggable="false">`:`<p>${esc(m.t||'')}</p>`))+`<button class="x" onclick="shut()">✕</button><button class="l" onclick="step(-1)">‹</button><button class="r" onclick="step(1)">›</button>`}
function step(d){li=(li+d+list.length)%list.length;show()}
function shut(){$('#lb').classList.remove('o');$('#lb').innerHTML=''}
document.addEventListener('keydown',e=>{if(!$('#lb').classList.contains('o'))return;if(e.key=='Escape')shut();if(e.key=='ArrowLeft')step(-1);if(e.key=='ArrowRight')step(1)});
document.addEventListener('contextmenu',e=>{if(e.target.closest('.ph,#lb'))e.preventDefault()});
document.addEventListener('dragstart',e=>e.preventDefault());
// owner
const cur=()=>route().id;
const ask=()=>demo?alert('Preview mode: add your Supabase URL and key in index.html to enable login.'):dlg.showModal();
async function doLogin(){const {error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});if(error)return alert('Login failed: '+error.message);dlg.close();$('#pw').value=''}
const out=()=>sb.auth.signOut();
const chk=r=>{if(r.error){alert(r.error.message);throw r.error}return r};
async function newAlbum(){const t=prompt('Album name');if(!t)return;chk(await sb.from('albums').insert({title:t.trim(),position:albums.length}));load()}
async function ren(){const a=albums.find(a=>a.id==cur()),t=prompt('New album name',a.title);if(!t)return;chk(await sb.from('albums').update({title:t.trim()}).eq('id',a.id));load()}
async function delAlbum(){if(!confirm('Delete this album and everything in it?'))return;const f=list.filter(m=>m.kind=='photo').flatMap(m=>[m.path,m.thumb_path]);
  if(f.length)await sb.storage.from(B).remove(f);chk(await sb.from('albums').delete().eq('id',cur()));location.hash='#/albums';load()}
async function cover(id){chk(await sb.from('albums').update({cover_id:id}).eq('id',cur()));load()}
async function move(id,d){const i=list.findIndex(m=>m.id==id),j=i+d;if(j<0||j>=list.length)return;const a=[...list];[a[i],a[j]]=[a[j],a[i]];
  await Promise.all(a.map((m,k)=>sb.from('media').update({position:k}).eq('id',m.id)));load()}
async function delMedia(id){if(!confirm('Delete this item?'))return;const m=media.find(m=>m.id==id);
  if(m.kind=='photo')await sb.storage.from(B).remove([m.path,m.thumb_path]);chk(await sb.from('media').delete().eq('id',id));
  await sb.from('albums').update({cover_id:null}).eq('cover_id',id);load()}
async function addVid(aid){const u=prompt('Paste the YouTube link (unlisted is fine)');if(!u)return;const x=u.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);if(!x)return alert('That is not a YouTube link.');
  chk(await sb.from('media').insert({album_id:aid,kind:'video',youtube_id:x[1],position:media.length}));load()}
const rs=(bm,max,q)=>{const k=Math.min(1,max/Math.max(bm.width,bm.height)),c=document.createElement('canvas');c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,'image/jpeg',q))};
async function up(inp){const fs=[...inp.files],aid=cur();let n=0,pos=list.length;
  for(const f of fs){busy=`Uploading ${++n} of ${fs.length}…`;render();
    try{const bm=await createImageBitmap(f,{imageOrientation:'from-image'}),full=await rs(bm,2560,.85),t=await rs(bm,480,.75),id=crypto.randomUUID(),p=`${aid}/${id}.jpg`,tp=`${aid}/${id}_t.jpg`,o={contentType:'image/jpeg',cacheControl:'31536000'};
      chk(await sb.storage.from(B).upload(p,full,o));chk(await sb.storage.from(B).upload(tp,t,o));
      chk(await sb.from('media').insert({album_id:aid,kind:'photo',path:p,thumb_path:tp,size:full.size+t.size,position:pos++}));
    }catch(e){alert(f.name+' failed: '+(e.message||e))}}
  busy='';inp.value='';load()}
// start
window.onhashchange=()=>{shut();render();if(!route().s)scrollTo(0,0)};
if(sb)sb.auth.onAuthStateChange((_e,s)=>{user=s?s.user:null;render()});
load();
</script></body></html>
