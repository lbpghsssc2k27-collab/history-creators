name: Keep Supabase Alive
on:
  schedule:
    - cron: '17 9 * * *'   # daily at 09:17 UTC
  workflow_dispatch:        # lets you test manually from the Actions tab

permissions:
  issues: write
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query keepalive table (3x)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            status=$(curl -sS -o /dev/null -w "%{http_code}" \
              --retry 5 --retry-all-errors --retry-delay 15 \
              "$SUPABASE_URL/rest/v1/keepalive?select=id,pinged_at&limit=1" \
              -H "apikey: $SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $SUPABASE_ANON_KEY")
            echo "Ping $i: HTTP $status"
            if [ "$status" != "200" ]; then
              exit 1
            fi
            sleep 2
          done

      - name: Open an issue if the ping failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🚨 Supabase keepalive failed';
            const body = `The daily keepalive workflow failed. Possible causes:\n\n- **DNS error / timeout**: The project may already be paused. Resume it from the Supabase dashboard, then re-run the workflow.\n- **401 / 403**: The anon key may have been rotated. Update the \`SUPABASE_ANON_KEY\` repo secret.`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'supabase-keepalive',
              state: 'open'
            });
            if (issues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body: `Another failure on ${new Date().toISOString()}`
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['supabase-keepalive']
              });
            }
